<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ============================================================
//  基本設定  （平面座標 e=東, n=北 → three.js: x=e, z=-n）
// ============================================================
const B = 160;                 // ブロックの半径（一辺 320m）
const BASE = -34;              // 地層の底
const D2R = Math.PI / 180;
const Y_BALLAST = 0.35, Y_RAIL = 0.66, Y_PLAT = 1.7;
const isTouch = matchMedia('(pointer: coarse)').matches;
// 駅と線路は「駅座標」で作り、まとめて S 倍して街より大きめにデフォルメする
const S = 1.25, BS = B / S;

const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const hash2 = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

// ============================================================
//  線路の中心線（Path）
// ============================================================
class Path {
  constructor(e = 0, n = 0, hdeg = 0) { this.pts = [{ e, n, h: hdeg * D2R, s: 0 }]; }
  static from(list) {
    const p = new Path(); p.pts = list; let s = 0;
    list.forEach((q, i) => { if (i) s += Math.hypot(q.e - list[i - 1].e, q.n - list[i - 1].n); q.s = s; });
    return p;
  }
  static chain(...paths) {   // 経路をつなぐ（重なった点は除く）
    const out = [];
    paths.forEach(p => p.pts.forEach(q => {
      const l = out[out.length - 1];
      if (!l || Math.hypot(q.e - l.e, q.n - l.n) > 0.05) out.push({ e: q.e, n: q.n, h: q.h });
    }));
    return Path.from(out);
  }
  static spline(points, step = 0.5) {     // 折れ線をなめらかな曲線にする
    const curve = new THREE.CatmullRomCurve3(points.map(([e, n]) => new THREE.Vector3(e, 0, n)), false, 'centripetal');
    const N = Math.max(2, Math.ceil(curve.getLength() / step)), ps = curve.getSpacedPoints(N);
    return Path.from(ps.map((q, i) => {
      const a = ps[Math.max(0, i - 1)], b = ps[Math.min(N, i + 1)];
      return { e: q.x, n: q.z, h: Math.atan2(b.x - a.x, b.z - a.z) };
    }));
  }
  get end() { return this.pts[this.pts.length - 1]; }
  get length() { return this.end.s; }
  straight(L) { return this._go(L, 0); }
  arc(R, deg) { return this._go(Math.abs(deg) * D2R * R, Math.sign(deg) / R); }   // deg>0 で右（時計回り）
  _go(L, k) {
    const steps = Math.max(1, Math.ceil(L / 0.5)), ds = L / steps;
    let { e, n, h, s } = this.end;
    for (let i = 0; i < steps; i++) {
      const hm = h + k * ds / 2;
      e += Math.sin(hm) * ds; n += Math.cos(hm) * ds; h += k * ds; s += ds;
      this.pts.push({ e, n, h, s });
    }
    return this;
  }
  offset(d) { return Path.from(this.pts.map(p => ({ e: p.e + d * Math.cos(p.h), n: p.n - d * Math.sin(p.h), h: p.h }))); }
  reversed() { return Path.from(this.pts.slice().reverse().map(p => ({ e: p.e, n: p.n, h: p.h + Math.PI }))); }
  slice(s0, s1) {
    const list = [this.at(s0)];
    this.pts.forEach(p => { if (p.s > s0 && p.s < s1) list.push({ e: p.e, n: p.n, h: p.h }); });
    list.push(this.at(s1));
    return Path.from(list);
  }
  at(s) {
    const P = this.pts;
    if (s <= 0) { const p = P[0]; return { e: p.e + Math.sin(p.h) * s, n: p.n + Math.cos(p.h) * s, h: p.h }; }
    if (s >= this.length) { const p = this.end, d = s - p.s; return { e: p.e + Math.sin(p.h) * d, n: p.n + Math.cos(p.h) * d, h: p.h }; }
    let lo = 0, hi = P.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (P[m].s <= s) lo = m; else hi = m; }
    const a = P[lo], b = P[hi], t = (s - a.s) / (b.s - a.s || 1);
    return { e: a.e + (b.e - a.e) * t, n: a.n + (b.n - a.n) * t, h: a.h + (b.h - a.h) * t };
  }
  sAtN(n) {     // n を最初に横切る位置の s（増減どちらでも）
    const P = this.pts, sg = Math.sign(P[0].n - n);
    for (let i = 1; i < P.length; i++) if (Math.sign(P[i].n - n) !== sg) {
      const t = (n - P[i - 1].n) / (P[i].n - P[i - 1].n || 1); return P[i - 1].s + (P[i].s - P[i - 1].s) * t;
    }
    return this.length;
  }
  atN(n) { return this.at(this.sAtN(n)); }
  eAtN(n) { return this.atN(n).e; }
  nearestS(e, n) {
    let best = 0, bd = Infinity;
    this.pts.forEach(p => { const d = (p.e - e) ** 2 + (p.n - n) ** 2; if (d < bd) { bd = d; best = p.s; } });
    return best;
  }
}

// --- 配線（OpenStreetMap の線路・道路を 0.75 倍して駅座標にしたもの） ---
const OSM = {
  C: [[12.44,-176.25],[11.02,-166.88],[9.61,-157.5],[8.21,-148.12],[6.8,-138.75],[5.46,-129.38],[4.13,-120.0],[2.78,-110.62],[1.44,-101.25],[0.1,-91.88],[-1.28,-82.5],[-2.68,-73.12],[-4.01,-63.75],[-5.37,-54.38],[-6.74,-45.0],[-8.11,-35.62],[-9.54,-26.25],[-10.98,-16.88],[-12.41,-7.5],[-13.83,1.88],[-15.25,11.25],[-16.66,20.62],[-18.08,30.0],[-20.06,39.38],[-22.98,48.75],[-26.42,58.12],[-30.72,67.5],[-35.58,76.88],[-41.34,86.25],[-48.39,95.62],[-57.01,105.0],[-66.85,114.38],[-78.77,123.75],[-86.14,129.0],[-98.36,137.7],[-110.57,146.41],[-122.79,155.11]],
  M: [[-1.1,-83.7],[-2.21,-76.2],[-1.82,-66.0],[-0.48,-57.0],[1.82,-46.5],[4.89,-36.0],[8.8,-25.5],[13.06,-15.0],[18.67,-3.75],[24.96,7.5],[32.15,18.75],[41.25,30.0],[51.31,41.25],[63.31,52.5],[75.74,63.75]],
  R176: [[-54.75,171.75],[-33.75,153.75],[-8.25,132.0],[0.75,123.75],[8.62,115.88],[42.45,81.53],[73.5,49.65],[78.9,43.5],[82.57,38.17],[86.18,31.65],[89.78,23.62],[92.55,14.55],[94.2,5.1],[99.75,-52.5],[101.25,-69.75],[102.75,-86.25],[103.5,-89.25],[105.0,-99.75],[106.5,-118.5],[108.0,-141.75],[112.5,-191.25]],
  SIDE_A: [[91.72,-8.48],[89.85,7.35],[86.7,18.75],[84.53,25.05],[79.88,34.12],[73.65,43.12],[69.82,47.03],[65.47,51.6],[62.47,54.75],[60.0,57.3],[51.15,66.6],[46.72,70.88],[37.65,79.65],[24.08,93.75],[6.3,112.27],[-2.1,121.43]],
  SIDE_B: [[-5.7,134.77],[12.0,117.68],[29.92,99.23],[43.8,84.97],[47.85,81.3],[52.5,76.5],[57.0,71.85],[65.93,62.7],[68.55,60.07],[71.55,57.07],[75.15,53.4],[78.97,48.97],[84.3,41.78],[86.32,38.78],[88.5,35.4],[92.78,26.25],[94.35,21.52],[95.1,18.6],[97.57,7.8]],
  EAST_EXIT: [[1.95,31.35],[5.1,32.78],[14.48,36.97],[22.42,40.42],[51.15,66.6],[57.0,71.85]],
  RS: [[-164.25,-144.75],[-110.25,-113.25],[-96.82,-106.12],[-84.75,-100.65],[-68.55,-95.4],[-51.15,-91.8],[-36.6,-90.6],[-27.08,-90.22],[0.0,-89.93],[46.58,-89.47],[95.25,-89.25],[103.5,-89.25],[114.0,-89.25],[123.75,-88.5],[132.75,-87.0],[140.25,-83.25],[146.25,-78.75],[157.5,-67.5]],
  RS_N: [[-56.25,-88.35],[-45.6,-87.53],[-23.48,-87.3],[-18.9,-87.22],[-10.5,-90.6],[-1.5,-90.53],[1.27,-90.53],[5.93,-90.45],[11.77,-85.88],[16.05,-85.88],[43.28,-85.43],[50.18,-85.28],[60.0,-85.2]],
  RS_S: [[-56.25,-97.88],[-46.35,-96.52],[-36.0,-95.7],[-23.33,-95.4],[-18.38,-95.25],[-10.5,-90.6],[-1.5,-90.53],[1.27,-90.53],[5.93,-90.45],[7.35,-91.57],[11.85,-94.8],[35.33,-94.8],[53.85,-94.65],[63.75,-94.65]],
  EGATE_OSM: [[2.7,26.47],[1.27,35.92],[-11.25,34.12],[-9.82,24.67]],
};
// 宝塚本線：南（大阪梅田）からほぼまっすぐ北北西へ。駅の北で西（池田）へ曲がる
const C = Path.spline(OSM.C);
// 東改札の駅舎（2号線と5号線の間の階段を避けるため、2号線に沿って少し北へ）
const EGATE = OSM.EGATE_OSM.map(([e, n]) => [e - 0.7, n + 4.6]);
const P1 = C.offset(-2), P2 = C.offset(2);                     // 1号線（下り）・2号線（上り）
// 5号線：車止めからまっすぐ北東へ。そのまま箕面線の本線になる
const B5 = { e: 2.475, n: 5.7 }, H5 = 47.73, L5P = 70;   // 車止め・向き・ホーム長
const P5 = new Path(B5.e, B5.n, H5).straight(200);
// 3号線・4号線：駅の南で複線のまま右へ分かれ、大きく右カーブして北東へ（今は回送用）
const P5r = P5.offset(6.35);
const M = Path.spline([...OSM.M, ...[78, 92, 108, 124, 140, 156].map(n => { const q = P5r.atN(n); return [q.e, q.n]; })]);
const P3 = M.offset(-2), P4 = M.offset(2);
// 駅の南の渡り線（1号線→2号線）
const PX = Path.spline([[P1.atN(-105.45).e, -105.45], [P2.atN(-122.1).e, -122.1]]);

// 列車の運転経路
const ROUTE = {
  TD: P1,                     // 宝塚本線 下り（梅田→池田）
  TU: P2.reversed(),          // 宝塚本線 上り（池田→梅田）
  MIN: P5.reversed(),         // 箕面→5号線
  MOUT: P5,                   // 5号線→箕面
};

// ============================================================
//  レンダラー・シーン・カメラ

  const roads = TOWN_ROADS.filter(([p, w, cls]) => (cls === 1 || cls === 2) && p.length > 30).map(([p, w]) => [p, w]);
  [MODEL_ROADS[2], MODEL_ROADS[3], MODEL_ROADS[4]].forEach(([p]) => roads.push([p, 4.5]));
  const carGeo = mergeGeometries([
    tinted(new RoundedBoxGeometry(3.5, 0.9, 1.7, 2, 0.28), '#ffffff', 0, 0.75, 0),
    tinted(new RoundedBoxGeometry(2.0, 0.66, 1.5, 2, 0.22), '#5a5f66', -0.25, 1.45, 0),
  ]);
  const bikeGeo = mergeGeometries([
    tinted(new THREE.BoxGeometry(1.5, 0.75, 0.1), '#3b3b3d', 0, 0.55, 0),
    tinted(new THREE.CylinderGeometry(0.22, 0.26, 0.95, 6), '#ffffff', 0, 1.35, 0),
    tinted(new THREE.SphereGeometry(0.22, 8, 6), '#f0d9c4', 0, 1.95, 0),
  ]);
  const cols = ['#1f1f22', '#e2b03a', '#2f5a45', '#eceae4', '#9da2a8', '#2f3c56', '#e7e3da', '#7a2b2b', '#1f1f22', '#e2b03a'];   // 黒・黄・緑はタクシー
  const mk = (n, geo, speed, laneK) => {
    const list = [];
    for (let i = 0; i < n; i++) { const [p, w] = roads[(i * 7 + 3) % roads.length]; list.push({ p, w, s: Math.random() * p.length, dir: i % 2 ? 1 : -1, v: speed * (0.8 + Math.random() * 0.4), laneK }); }
    (geo === carGeo ? AUDIO_SRC.cars : AUDIO_SRC.bikes).push(...list);
    const m = new THREE.InstancedMesh(geo, std('#ffffff', { roughness: 0.45, metalness: 0.15, vertexColors: true }), n);
    const c = new THREE.Color(); list.forEach((x, i) => m.setColorAt(i, c.set(cols[(i * 3) % cols.length])));
    m.castShadow = true; st.add(m);
    UPDATERS.push((dt) => {
      list.forEach((x, i) => {
        const a0 = x.p.at(x.s), a1 = x.p.at(x.s + x.dir * 3);
        if (!waitAtCrossing(a0.e, a0.n, a1.e, a1.n)) x.s += x.dir * x.v * dt;      // 踏切が鳴っていたら手前で待つ
        if (x.s < 1 || x.s > x.p.length - 1) { x.dir *= -1; x.s = Math.max(1, Math.min(x.p.length - 1, x.s)); }
        const q = x.p.at(x.s), lat = -x.dir * x.laneK(x.w), e = q.e + lat * Math.cos(q.h), n = q.n - lat * Math.sin(q.h);
        obj3.position.set(e, 0.05, -n); obj3.rotation.set(0, Math.PI / 2 - q.h + (x.dir < 0 ? Math.PI : 0), 0); obj3.scale.setScalar(1);
        obj3.updateMatrix(); m.setMatrixAt(i, obj3.matrix);
      });
      m.instanceMatrix.needsUpdate = true;
    });
  };
  mk(24, carGeo, 5.5, w => w * 0.22);
  mk(30, bikeGeo, 2.1, w => w / 2 - 0.55);
}


// ---------- 高架の道路を走る車（交差点に信号。夕方は台数が増えて渋滞する） ----------
{
  const CARL = 3.6, VMAX = 8;
  // 信号：176号線側 → 府道側 の順に青。黄3秒・全赤1秒
  const CYCLE = 30, phaseOf = (name, t) => {
    const x = t % CYCLE, a = name === '176' ? x : (x + CYCLE / 2) % CYCLE;
    return a < 11 ? 'G' : a < 14 ? 'Y' : 'R';
  };
  const lanes = [];
  VIADUCTS.forEach(V => [1, -1].forEach(dir => lanes.push({ V, dir, cars: [], L: V.path.length, stopP: dir > 0 ? V.jS - 7 : V.path.length - V.jS - 7 })));
  const POOL = 18, all = [];
  const carGeo = mergeGeometries([
    tinted(new RoundedBoxGeometry(3.5, 0.9, 1.7, 2, 0.28), '#ffffff', 0, 0.75, 0),
    tinted(new RoundedBoxGeometry(2.0, 0.66, 1.5, 2, 0.22), '#5a5f66', -0.25, 1.45, 0),
  ]);
  // テールランプ・ヘッドライト（夕方から点く）
  const lightGeo = mergeGeometries([
    ...[-0.55, 0.55].map(z => tinted(new THREE.BoxGeometry(0.08, 0.2, 0.36), '#fff6dc', 1.76, 0.85, z)),
    ...[-0.6, 0.6].map(z => tinted(new THREE.BoxGeometry(0.08, 0.2, 0.34), '#ff2a1c', -1.76, 0.85, z)),
  ]);
  const cols = ['#eceae4', '#1f1f22', '#9da2a8', '#2f3c56', '#7a2b2b', '#e2b03a', '#d8d2c2', '#3d4a3f', '#bfc3c7', '#2f5a45'];
  const N = lanes.length * POOL;
  const mesh = new THREE.InstancedMesh(carGeo, std('#ffffff', { roughness: 0.45, metalness: 0.15, vertexColors: true }), N);
  const lights = new THREE.InstancedMesh(lightGeo, new THREE.MeshBasicMaterial({ vertexColors: true, toneMapped: false, clippingPlanes: CLIP_ALL, transparent: true, opacity: 0 }), N);
  mesh.castShadow = true; st.add(mesh, lights);
  const c = new THREE.Color();
  lanes.forEach((ln, li) => { for (let i = 0; i < POOL; i++) { const car = { ln, s: 0, v: 0, on: false, idx: all.length, stopT: 0, p: ln.V.path }; all.push(car); mesh.setColorAt(car.idx, c.set(cols[(car.idx * 7) % cols.length])); } });
  AUDIO_SRC.cars.push(...all);
  // 信号機（交差点の角に2基ずつ）
  const sigMats = { 176: ['G', 'Y', 'R'].map(() => std('#222', { emissive: '#000', emissiveIntensity: 1 })), RS: ['G', 'Y', 'R'].map(() => std('#222', { emissive: '#000', emissiveIntensity: 1 })) };
  const LCOL = { G: '#39d98a', Y: '#ffc23a', R: '#ff3b2e' };
  {
    const J = JUNCTION, pole = new THREE.CylinderGeometry(0.12, 0.14, 5.2, 8), head = new RoundedBoxGeometry(2.0, 0.6, 0.5, 1, 0.12), lamp = new THREE.CircleGeometry(0.2, 12);
    [['176', 8, -8, Math.PI / 2], ['176', -8, 8, -Math.PI / 2], ['RS', -8, -8, 0], ['RS', 8, 8, Math.PI]].forEach(([nm, de, dn, ry]) => {
      const g = new THREE.Group(); g.position.set(J.e + de, 0, -(J.n + dn)); g.rotation.y = ry; st.add(g);
      const pm = new THREE.Mesh(pole, std('#8b8d8f')); pm.position.y = 2.6; g.add(pm);
      const hm = new THREE.Mesh(head, std('#3a3c3e')); hm.position.set(0, 5.0, 0.3); g.add(hm);
      ['G', 'Y', 'R'].forEach((k, i) => { const l = new THREE.Mesh(lamp, sigMats[nm][i]); l.position.set(-0.65 + i * 0.65, 5.0, 0.56); g.add(l); });
    });
  }
  const pos = (car) => {
    const { V, dir } = car.ln, q = V.path.at(car.s), lat = -dir * V.w * 0.24;
    return { e: q.e + lat * Math.cos(q.h), n: q.n - lat * Math.sin(q.h), y: terrainY(q.e, q.n) + V.h(car.s) + 0.13, h: q.h };
  };
  const prog = (car) => car.ln.dir > 0 ? car.s : car.ln.L - car.s;
  let clock = 0, honkT = 4;
  UPDATERS.push((dt) => {
    clock += dt;
    const evening = smooth(1.62, 1.85, TOD) * (1 - smooth(2.45, 2.75, TOD));      // 16時ごろ〜19時ごろ
    const target = Math.round(4 + evening * (POOL - 5) - smooth(2.6, 2.9, TOD) * 2);
    const vmax = VMAX * (1 - evening * 0.3);
    ['176', 'RS'].forEach(nm => { const ph = phaseOf(nm, clock); ['G', 'Y', 'R'].forEach((k, i) => { const m = sigMats[nm][i]; m.emissive.set(ph === k ? LCOL[k] : '#000'); m.color.set(ph === k ? LCOL[k] : '#2a2a2a'); m.emissiveIntensity = ph === k ? 1.6 : 0; }); });
    lanes.forEach(ln => {
      const act = ln.cars;
      // 入ってくる車：入口があいていて台数が目標より少なければ
      const lastP = act.length ? Math.min(...act.map(prog)) : Infinity;
      if (act.length < target && lastP > CARL + 6 + Math.random() * 6) {
        const car = all.find(x => x.ln === ln && !x.on);
        if (car) { car.on = true; car.s = ln.dir > 0 ? 1 : ln.L - 1; car.v = vmax * 0.8; car.stopT = 0; act.push(car); }
      }
      act.sort((a, b) => prog(b) - prog(a));                      // 先頭から順に
      const ph = phaseOf(ln.V.name, clock);
      act.forEach((car, i) => {
        const p = prog(car);
        let gap = i ? prog(act[i - 1]) - p - CARL : Infinity;
        const dStop = ln.stopP - p;                                // 停止線まで
        if (dStop > 0 && ph !== 'G' && !(ph === 'Y' && dStop < car.v * car.v / 6)) gap = Math.min(gap, dStop);
        const want = Math.max(0, Math.min(vmax, (gap - 1.6) / 1.1));
        car.v += Math.max(-6 * dt, Math.min(2.2 * dt, want - car.v));
        car.s += ln.dir * car.v * dt;
        car.stopT = car.v < 0.3 ? car.stopT + dt : 0;
        if (prog(car) > ln.L - 1) { car.on = false; }
      });
      ln.cars = act.filter(x => x.on);
    });
    // クラクション（渋滞で長く止まっている時、たまに）
    honkT -= dt;
    if (honkT < 0) {
      honkT = 6 + Math.random() * 10;
      const stuck = all.filter(x => x.on && x.stopT > 5);
      if (evening > 0.5 && stuck.length && window.__snd) { const q = pos(stuck[Math.floor(Math.random() * stuck.length)]); window.__snd.honk(q.e, q.n); }
    }
    const lk = smooth(1.75, 2.25, TOD);
    lights.material.opacity = lk; lights.visible = lk > 0.02;
    all.forEach(car => {
      if (!car.on) { obj3.scale.setScalar(0); obj3.updateMatrix(); mesh.setMatrixAt(car.idx, obj3.matrix); lights.setMatrixAt(car.idx, obj3.matrix); return; }
      const q = pos(car);
      obj3.position.set(q.e, q.y, -q.n); obj3.rotation.set(0, Math.PI / 2 - q.h + (car.ln.dir < 0 ? Math.PI : 0), 0); obj3.scale.setScalar(1);
      obj3.updateMatrix(); mesh.setMatrixAt(car.idx, obj3.matrix); lights.setMatrixAt(car.idx, obj3.matrix);
    });
    mesh.instanceMatrix.needsUpdate = true; lights.instanceMatrix.needsUpdate = true;
  });
}

// ---------- 夜のホーム・アーケードの照明（屋根の下の光る帯） ----------
{
  const stripMat = std('#d7d3ca', { emissive: '#fff2d6', emissiveIntensity: 0.04, roughness: 0.5 });
  NIGHT.push([stripMat, 0.04, 2.2]);
  const geos = [];
  const strip = (p, s0, s1, y) => { if (s1 - s0 > 2) geos.push(sweep(p.slice(s0, s1), [[-0.24, y], [-0.24, y + 0.06], [0.24, y + 0.06], [0.24, y]], { step: 1 })); };
  const sN = (p, n) => p.sAtN(n), yC = Y_PLAT + 3.4 - 0.26, yBig = Y_PLAT + 4.2 - 0.08;
  { const p = P1.offset(-4.1); strip(p, sN(p, -45), sN(p, 86), yC); }
  { const p = P4.offset(4.1); strip(p, sN(p, -50), sN(p, 30), yC); }
  { const p = P2.offset(4.4); strip(p, sN(p, ISL_N0 + 8), sN(p, PL2_N - 2), yBig); }
  strip(P5.offset(-3.4), 3, L5P - 2, yBig); strip(P5.offset(3.4), 3, ISL_STIP - 2, yBig);
  { const p = P3.offset(-4.3); strip(p, sN(p, ISL_N0 + 8), sN(p, 24), yBig); }
  // アーケードの下
  Object.values(TOWN.ARC).flat().forEach(f => {
    const p = Path.poly(pairs(f), 1); let s0 = null;
    for (let s = 0; s <= p.length; s += 1) {
      const q = p.at(s), inside = Math.abs(q.e) < BS - 1 && Math.abs(q.n) < BS - 1 && ROOFS.some(r => pip(q.e, q.n, r));
      if (inside && s0 === null) s0 = s;
      if ((!inside || s >= p.length) && s0 !== null) { strip(p, s0, s, ARC_Y - 0.45); s0 = null; }
    }
  });
  if (geos.length) st.add(new THREE.Mesh(mergeGeometries(geos), stripMat));
}

// ---------- ワニの化石（東側の断面、深い地層にこっそり） ----------
{
  const bone = std('#e9dfc7', { roughness: 0.75, emissive: '#2a2216', emissiveIntensity: 0.1 }, CLIP_SEC);
  const g = new THREE.Group(); g.position.set(B + 0.05, -27.6, -6); g.rotation.y = Math.PI / 2; scene.add(g);   // ローカル x = 北向き、y = 上
  const put = (geo, x, y, rz = 0, sx = 1, sy = 1) => { const m = new THREE.Mesh(geo, bone); m.position.set(x, y, 0.08); m.rotation.z = rz; m.scale.set(sx, sy, 1); g.add(m); return m; };
  const flat = (w, h, r = 0.12) => new RoundedBoxGeometry(w, h, 0.32, 2, r);
  // 頭骨（細長い吻）
  const skull = new THREE.Shape(); skull.moveTo(0, -0.55); skull.lineTo(3.4, -0.18); skull.quadraticCurveTo(3.8, 0, 3.4, 0.18); skull.lineTo(0, 0.62); skull.quadraticCurveTo(-0.45, 0, 0, -0.55);
  const sg = new THREE.ExtrudeGeometry(skull, { depth: 0.3, bevelEnabled: true, bevelSize: 0.06, bevelThickness: 0.05, bevelSegments: 2 });
  const sk = new THREE.Mesh(sg, bone); sk.position.set(5.2, 0.15, 0); sk.rotation.z = 0.05; g.add(sk);
  const eye = new THREE.Mesh(new THREE.CircleGeometry(0.16, 12), std('#5a4a38', {}, CLIP_SEC)); eye.position.set(5.75, 0.36, 0.42); g.add(eye);
  // 背骨と肋骨
  for (let i = 0; i < 11; i++) {
    const x = 4.7 - i * 0.62, y = 0.1 + Math.sin(i * 0.45) * 0.18;
    put(flat(0.46, 0.5), x, y, Math.sin(i * 0.45) * 0.2);
    if (i > 1 && i < 9) { put(flat(0.12, 1.1, 0.05), x, y - 0.75, 0.25); put(flat(0.12, 0.9, 0.05), x - 0.1, y + 0.62, -0.3); }
  }
  // 尾
  for (let i = 0; i < 16; i++) { const t = i / 15, x = -2.3 - i * 0.5, y = 0.2 + Math.sin(i * 0.38 + 0.6) * 0.55; put(flat(0.42 - t * 0.24, 0.4 - t * 0.22, 0.08), x, y, Math.cos(i * 0.38) * 0.4); }
  // 四肢
  [[3.8, 1], [3.6, -1], [-0.9, 1], [-1.1, -1]].forEach(([x, sd]) => {
    put(flat(0.22, 1.0, 0.08), x, 0.1 + sd * 0.8, sd * 0.6);
    put(flat(0.18, 0.8, 0.07), x + 0.45, 0.1 + sd * 1.5, sd * -0.3);
    for (let f = -1; f <= 1; f++) put(flat(0.08, 0.36, 0.03), x + 0.6 + f * 0.16, 0.1 + sd * 1.95, f * 0.4);
  });
}

// ---------- 時間帯（朝・昼・夕方・夜） ----------
const KEYS = [
  { name: '朝', min: 6 * 60 + 30, el: 22, az: 110, sun: '#ffd8ac', si: 2.1, sky: '#dfe8f0', gnd: '#8a7a66', hi: 1.05, top: '#c8d8e6', bot: '#f3e4d3', fog: '#e1ddd5', exp: 1.0 },
  { name: '昼', min: 12 * 60, el: 62, az: 170, sun: '#fff3e2', si: 2.4, sky: '#fff6e8', gnd: '#7d6d5b', hi: 1.15, top: '#f1ece3', bot: '#d8cfc2', fog: '#ddd5c8', exp: 1.05 },
  { name: '夕方', min: 17 * 60 + 30, el: 16, az: 248, sun: '#ffa866', si: 2.0, sky: '#f1c6a4', gnd: '#6a5446', hi: 0.9, top: '#f0be95', bot: '#b996a2', fog: '#d4ae9e', exp: 1.0 },
  { name: '夜', min: 21 * 60, el: 48, az: 215, sun: '#a9bdf0', si: 0.6, sky: '#4a5a80', gnd: '#24211f', hi: 0.62, top: '#141d36', bot: '#323a5c', fog: '#2a3250', exp: 1.25 },
];
const bgCanvas = document.createElement('canvas'); bgCanvas.width = 4; bgCanvas.height = 256;
const bgTex = new THREE.CanvasTexture(bgCanvas); bgTex.colorSpace = THREE.SRGBColorSpace; scene.background = bgTex;
const cA3 = new THREE.Color(), cB3 = new THREE.Color();
const lerpC = (a, b, k) => cA3.set(a).lerp(cB3.set(b), k).clone();
let nightK = 0, TOD = 1;
function setTime(t) {
  const i = Math.min(2, Math.floor(t)), k = t - i, A = KEYS[i], Bk = KEYS[i + 1], L = (x, y) => x + (y - x) * k;
  const el = L(A.el, Bk.el) * D2R, az = L(A.az, Bk.az) * D2R;
  sun.position.set(Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el)).multiplyScalar(420);
  sun.color.copy(lerpC(A.sun, Bk.sun, k)); sun.intensity = L(A.si, Bk.si);
  hemi.color.copy(lerpC(A.sky, Bk.sky, k)); hemi.groundColor.copy(lerpC(A.gnd, Bk.gnd, k)); hemi.intensity = L(A.hi, Bk.hi);
  renderer.toneMappingExposure = L(A.exp, Bk.exp);
  scene.fog.color.copy(lerpC(A.fog, Bk.fog, k));
  const x = bgCanvas.getContext('2d'), gr = x.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#' + lerpC(A.top, Bk.top, k).getHexString()); gr.addColorStop(1, '#' + lerpC(A.bot, Bk.bot, k).getHexString());
  x.fillStyle = gr; x.fillRect(0, 0, 4, 256); bgTex.needsUpdate = true;
  nightK = smooth(2.15, 2.85, t); TOD = t;
  NIGHT.forEach(([m, base, add]) => { m.emissiveIntensity = base + add * nightK; });
  document.body.classList.toggle('night', nightK > 0.5);
  const mins = Math.round(L(A.min, Bk.min)), name = t < 0.5 ? '朝' : t < 1.5 ? '昼' : t < 2.5 ? '夕方' : '夜';
  const clock = `${Math.floor(mins / 60)}:${String(mins % 60).padStart(2, '0')}`;
  document.getElementById('clock').innerHTML = `${name}<b>${clock}</b>`;
  document.getElementById('todName').textContent = `${name} ${clock}`;
  if (window.__snd) window.__snd.clock(mins, t);
}

// ---------- 模型写真らしさ：ティルトシフト（上下をぼかす）と周辺減光 ----------
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: isTouch ? 2 : 4 }));
composer.addPass(new RenderPass(scene, camera));
const tiltPass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uRes: { value: new THREE.Vector2(1, 1) }, uFocus: { value: 0.5 }, uRange: { value: 0.2 }, uAmount: { value: 0 }, uVig: { value: 0.16 } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform vec2 uRes; uniform float uFocus, uRange, uAmount, uVig; varying vec2 vUv;
    void main() {
      vec4 c = texture2D(tDiffuse, vUv);
      float b = smoothstep(uRange, uRange + 0.36, abs(vUv.y - uFocus)) * uAmount;
      if (b > 0.3) {
        vec4 acc = c; vec2 px = vec2(b) / uRes;
        for (int i = 1; i < 13; i++) { float a = float(i) * 2.39996, r = sqrt(float(i)) / 3.6; acc += texture2D(tDiffuse, vUv + vec2(cos(a), sin(a)) * r * px); }
        c = acc / 13.0;
      }
      float v = smoothstep(0.35, 0.95, length((vUv - 0.5) * vec2(1.15, 1.0)));
      c.rgb *= 1.0 - v * uVig;
      gl_FragColor = c;
    }`,
});
composer.addPass(tiltPass);
composer.addPass(new OutputPass());
let tiltOn = true;
function tiltStrength() {
  const base = (isTouch ? 3.4 : 5.2) * renderer.getPixelRatio();
  return !tiltOn ? 0 : viewName === 'section' ? base * 0.35 : viewName === 'top' ? base * 0.55 : base;

const SND = (() => {
  let ctx = null, master, rev, B, meter, enabled = true, started = false;
  let wind, traffic;
  const voices = new Map(), bells = new Map();
  let gust = 0.5, gustT = 0, crowNext = 0, bikeNext = 8, lastMin = null, chimeUntil = 0, tod = 1;
  const _p = new THREE.Vector3(), _r = new THREE.Vector3();
  const now = () => ctx.currentTime;

  function noiseBuf(type) {
    const len = ctx.sampleRate * 3, b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
    let l = 0, p0 = 0, p1 = 0, p2 = 0;
    for (let i = 0; i < len; i++) {

      else if (type === 'pink') { p0 = 0.99765 * p0 + w * 0.099046; p1 = 0.963 * p1 + w * 0.2965164; p2 = 0.57 * p2 + w * 1.0526913; d[i] = (p0 + p1 + p2 + w * 0.1848) * 0.18; }

  }
  function impulse(sec, decay) {                      // 屋外らしい広がりの残響
    const len = ctx.sampleRate * sec, b = ctx.createBuffer(2, len, ctx.sampleRate);

    return b;
  }
  const loop = (buf) => { const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.loopStart = Math.random(); s.start(now(), Math.random() * 2); return s; };
  const filt = (type, f, q = 0.7) => { const n = ctx.createBiquadFilter(); n.type = type; n.frequency.value = f; n.Q.value = q; return n; };
  const gain = (v = 0) => { const g = ctx.createGain(); g.gain.value = v; return g; };
  const pan = () => (ctx.createStereoPanner ? ctx.createStereoPanner() : gain(1));
  const link = (...n) => { for (let i = 0; i < n.length - 1; i++) n[i].connect(n[i + 1]); return n[n.length - 1]; };
  const set = (param, v, tc = 0.12) => param.setTargetAtTime(v, now(), tc);
  // 聞いている位置（カメラ）からの距離による音量と左右の定位
  function place(e, n, y = 1) {

  const att = (d, ref) => 1 / (1 + Math.pow(d / ref, 1.7));

  function init() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = gain(0.9);
    meter = ctx.createAnalyser(); meter.fftSize = 2048; master.connect(meter);

  }

  // ---- 電車1編成ぶんの音 ----
  function trainVoice() {
    const out = gain(0), p = pan(); link(out, p, master); link(out, gain(0.22), rev);
    const rg = gain(0), railG = gain(0), motG = gain(0), sqG = gain(0);
    link(loop(B.brown), filt('lowpass', 150), rg, out);                       // 低い走行音
    link(loop(B.pink), filt('bandpass', 780, 0.9), railG, out);               // レールの音
    const mot = ctx.createOscillator(), mot2 = ctx.createOscillator();        // モーター（速度とともに音程が上がる）
    mot.type = 'sawtooth'; mot2.type = 'square'; mot2.detune.value = 700;
    const mf = filt('bandpass', 1100, 2.5); mot.connect(mf); mot2.connect(mf); link(mf, motG, out); mot.start(); mot2.start();
    const sq = ctx.createOscillator(); sq.frequency.value = 3300; const vib = ctx.createOscillator(); vib.frequency.value = 6.5;
    const vg = gain(28); link(vib, vg); vg.connect(sq.frequency); link(sq, sqG, out); sq.start(); vib.start();   // ブレーキのきしみ

  }
  function clack(when, vol, panV) {                                          // ガタン・ゴトン
    const s = ctx.createBufferSource(); s.buffer = B.white;
    const g = gain(0), p = pan(); if (p.pan) p.pan.value = panV;
    link(s, filt('bandpass', 240, 1.1), g, p, master);
    g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(vol, when + 0.004); g.gain.exponentialRampToValueAtTime(0.0008, when + 0.09);
    s.start(when, Math.random() * 2, 0.12);
  }
  function updateTrains(trs) {
    const alive = new Set();
    trs.forEach(t => {
      if (t.dead || t.state === 'away' || !t.cars.length) return;
      alive.add(t);
      let v = voices.get(t); if (!v) { v = trainVoice(); voices.set(t, v); }
      const mid = t.cars[Math.floor(t.cars.length / 2)].position, pl = place(mid.x, -mid.z, 2);
      const a = att(pl.d, 75), sp = t.v / TR.vmax;
      if (v.p.pan) set(v.p.pan, pl.pan, 0.2);
      set(v.out.gain, a, 0.15);
      set(v.rg.gain, (0.12 + 0.88 * sp) * 0.9 * (sp > 0.01 ? 1 : 0.15));
      set(v.railG.gain, sp * 0.45);
      const f = 160 + t.v * 52; set(v.mot.frequency, f, 0.25); set(v.mot2.frequency, f * 1.5, 0.25);
      const accel = t.state === 'run' && (t.v < TR.vmax - 0.3);
      set(v.motG.gain, sp > 0.02 ? (accel ? 0.05 : 0.015) : 0, 0.3);
      set(v.sqG.gain, t.state === 'run' && t.stopS != null && t.v < 3.2 && t.v > 0.25 && t.stopS - t.s < 30 ? 0.012 : 0, 0.2);
      // 継ぎ目の音：1両ぶん進むごとに台車4つ
      if (t.v > 0.6 && pl.d < 260) {
        if (v.next < now()) v.next = now();
        while (v.next < now() + 0.25) {
          const T0 = v.next, k = 1 / t.v, vol = a * Math.min(1, sp * 1.4) * 0.55;
          [0, 2.4, 5.1, 7.5].forEach(x => clack(T0 + x * k, vol, pl.pan));
          v.next += (CAR + GAP) * k;
        }
      }
    });
    voices.forEach((v, t) => {
      if (alive.has(t)) return;
      set(v.out.gain, 0, 0.2); setTimeout(() => { v.stops.forEach(o => { try { o.stop(); } catch (e) {} }); v.out.disconnect(); }, 1500);
      voices.delete(t);
    });
  }
  // ---- 踏切：カンカン（左右の警報器が少しずれた音程で交互に） ----
  function ding(when, f, vol, panV) {
    const g = gain(0), p = pan(); if (p.pan) p.pan.value = panV;
    link(g, p, master); link(g, gain(0.3), rev);
    [[1, 1], [2.72, 0.35], [5.1, 0.12]].forEach(([m, a]) => {
      const o = ctx.createOscillator(); o.type = m === 1 ? 'triangle' : 'sine'; o.frequency.value = f * m;
      const og = gain(a); link(o, og, g); o.start(when); o.stop(when + 0.5);
    });
    g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(vol, when + 0.004); g.gain.exponentialRampToValueAtTime(0.0005, when + 0.32);
  }
  function updateCrossings(list) {
    list.forEach(c => {
      let b = bells.get(c); if (!b) { b = { next: 0, i: 0 }; bells.set(c, b); }
      if (!c.active) { b.next = 0; return; }
      const pl = place(c.e, c.n, 3), a = att(pl.d, 60) * 0.32;
      if (b.next < now()) b.next = now() + 0.02;
      while (b.next < now() + 0.2) { ding(b.next, b.i % 2 ? 690 : 760, a, pl.pan + (b.i % 2 ? 0.1 : -0.1)); b.i++; b.next += 0.43; }
    });
  }
  // ---- 車の流れと自転車のベル ----
  function updateTraffic(cars, bikes, night, dt) {
    let sum = 0, px = 0;
    cars.forEach(x => { const q = x.p.at(x.s), pl = place(q.e, q.n, 1); const w = 1 / (1 + Math.pow(pl.d / 34, 2)); sum += w; px += w * pl.pan; });
    set(traffic.g.gain, Math.min(0.42, sum * 0.16) * (night ? 0.55 : 1), 0.4);
    if (traffic.p.pan) set(traffic.p.pan, sum ? px / sum : 0, 0.5);
    bikeNext -= dt;
    if (bikeNext < 0) {
      bikeNext = 9 + Math.random() * 14;
      const b = bikes[Math.floor(Math.random() * bikes.length)]; if (!b) return;
      const q = b.p.at(b.s), pl = place(q.e, q.n, 1), a = att(pl.d, 40) * 0.12;
      if (a > 0.01) [0, 0.16].forEach(dt => ding(now() + dt, 2550, a, pl.pan));       // チリンチリン
    }
  }
  // ---- 渋滞のクラクション ----
  function honk(e, n) {
    if (!ctx || !started || !enabled) return;
    const pl = place(e, n, 2), a = att(pl.d, 50) * 0.08; if (a < 0.004) return;
    const g = gain(0), p = pan(); if (p.pan) p.pan.value = pl.pan; link(g, filt('lowpass', 1800), p, master); link(g, gain(0.3), rev);
    const t = now(), len = Math.random() < 0.5 ? 0.18 : 0.42;
    [415, 520].forEach(f => { const o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = f; o.connect(g); o.start(t); o.stop(t + len + 0.05); });

  // ---- 夕方のカラス ----
  function caw(when, vol, panV, f0) {

    for (let i = 0; i < 256; i++) { const x = i / 128 - 1; curve[i] = Math.tanh(x * 3.5); } shp.curve = curve;
    const g = gain(0), p = pan(); if (p.pan) p.pan.value = panV;
    o.connect(shp); o2.connect(shp); link(shp, filt('bandpass', 1250, 1.3), filt('peaking', 2400, 2), g, p, master); link(g, gain(0.6), rev);
    [o, o2].forEach(x => { x.frequency.setValueAtTime(f0, when); x.frequency.linearRampToValueAtTime(f0 * 1.08, when + 0.06); x.frequency.exponentialRampToValueAtTime(f0 * 0.74, when + 0.38); x.start(when); x.stop(when + 0.5); });
    g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(vol, when + 0.035); g.gain.setTargetAtTime(vol * 0.6, when + 0.12, 0.08); g.gain.linearRampToValueAtTime(0, when + 0.42);
  }
  // ---- 17時のチャイム（オリジナルの短い旋律、屋外スピーカーのこだま付き） ----
  const NOTE = { F4: 349.23, G4: 392, A4: 440, C5: 523.25, D5: 587.33, F5: 698.46 };
  const MEL = [['C5', 1], ['C5', 1], ['D5', 1], ['C5', 1], ['A4', 2], ['G4', 1], ['F4', 1],
    ['G4', 1], ['A4', 1], ['C5', 1], ['A4', 1], ['G4', 4],
    ['A4', 1], ['C5', 1], ['D5', 1], ['F5', 1], ['D5', 1], ['C5', 1], ['A4', 2],
    ['G4', 1], ['A4', 1], ['C5', 1], ['G4', 1], ['F4', 4]];
  function chime() {

      const f = NOTE[n], g = gain(0); link(g, bus);

      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(1, t + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t + 2.2);

  }

  function update(dt) {
    if (!started || !enabled) return;
    gustT -= dt; if (gustT < 0) { gustT = 1.5 + Math.random() * 3.5; gust = 0.3 + Math.random() * 0.8; }
    const night = tod > 2.6;
    set(wind.g.gain, (0.05 + gust * 0.07) * (night ? 0.8 : 1), 1.2);
    updateTrains(trains);
    updateCrossings(CROSSINGS);
    updateTraffic(AUDIO_SRC.cars, AUDIO_SRC.bikes, night, dt);
    if (tod > 1.7 && tod < 2.6) {                                            // 16:30〜18:30 ごろ
      crowNext -= dt;
      if (crowNext < 0) {

        const n = 2 + Math.floor(Math.random() * 2), pv = (Math.random() - 0.5) * 1.4, f0 = 520 + Math.random() * 140, vol = 0.07 + Math.random() * 0.05;

    toggle(on) { enabled = on; if (!ctx) { if (on) start(); return; } set(master.gain, on ? 0.9 : 0, 0.1); if (on) { ctx.resume(); started = true; } },

      tod = t;

    playing: () => performance.now() < chimeUntil,
    honk,
    level() { if (!meter) return 0; const a = new Float32Array(meter.fftSize); meter.getFloatTimeDomainData(a); let r = 0; a.forEach(v => r += v * v); return Math.sqrt(r / a.length); },
    state: () => ctx ? ctx.state : 'none',
  };
})();
['pointerdown', 'keydown', 'touchend'].forEach(ev => addEventListener(ev, () => SND.start(), { passive: true }));
window.__snd = SND;
UPDATERS.push((dt) => { SND.update(dt); document.getElementById('clock').classList.toggle('chime', SND.playing()); });
{
  const b = document.getElementById('btnSound'); let on = true;
  b.addEventListener('click', (ev) => { ev.stopPropagation(); on = !on; b.classList.toggle('on', on); SND.toggle(on); });
}

// ============================================================
//  カメラ・操作
// ============================================================
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 25; controls.maxDistance = 2600;
controls.maxPolarAngle = 86 * D2R;
controls.screenSpacePanning = true;
const TGT = new THREE.Vector3(10, 0, -6);

function halfFovs() {
  const v = camera.fov * D2R / 2, h = Math.atan(Math.tan(v) * camera.aspect);
  return { v, h };
}
const VIEWS = {
  sw() {
    const { v, h } = halfFovs(), d = 250 / Math.sin(Math.min(v, h)) * (camera.aspect < 1 ? 1.02 : 0.9);
    return { pos: TGT.clone().addScaledVector(new THREE.Vector3(1, 0.95, 1).normalize(), d), tgt: TGT.clone() };      // 南東の上空から北西を見る
  },
  top() {
    const { v, h } = halfFovs(), d = 196 / Math.tan(Math.min(v, h));
    return { pos: new THREE.Vector3(0, d, 0.01), tgt: new THREE.Vector3(0, 0, 0) };
  },
  section() {
    const { h } = halfFovs(), d = Math.max(80, 40 / Math.tan(h));
    const tgt = new THREE.Vector3((PAS.e0 + PAS.e1) / 2 * S, -1.8 * S, -CUT_N * S - 2);
    return { pos: tgt.clone().addScaledVector(new THREE.Vector3(-0.22, 0.24, 1).normalize(), d), tgt };
  },
};
let tween = null, viewName = 'sw', labelsOn = false;
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function setSection(on) {
  secPlane.constant = on ? -CUT_N * S : 1e5;
  capGroup.visible = capSt.visible = on;
  labelGroup.children.forEach(s => { s.visible = labelsOn && (!on || s.userData.isPassage); });
}
function go(name, instant = false) {
  viewName = name;
  setSection(name === 'section');
  const v = VIEWS[name]();
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === name));
  if (instant) { camera.position.copy(v.pos); controls.target.copy(v.tgt); controls.update(); return; }
  tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: v.pos, t1: v.tgt, start: performance.now(), dur: 1400 };
}
controls.addEventListener('start', () => { tween = null; });
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 1 ? 46 : 32;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth, innerHeight);
  tiltPass.uniforms.uRes.value.set(innerWidth * renderer.getPixelRatio(), innerHeight * renderer.getPixelRatio());
}
addEventListener('resize', resize);
resize();
go('sw', true);
setSection(false);

// ============================================================
//  描画ループ
// ============================================================
let lastT = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  UPDATERS.forEach(f => f(dt, now / 1000));
  if (tween) {
    const k = ease(Math.min(1, (now - tween.start) / tween.dur));
    camera.position.lerpVectors(tween.p0, tween.p1, k);
    controls.target.lerpVectors(tween.t0, tween.t1, k);
    if (k >= 1) tween = null;
  }
  controls.target.x = THREE.MathUtils.clamp(controls.target.x, -B, B);
  controls.target.z = THREE.MathUtils.clamp(controls.target.z, -B, B);
  controls.target.y = THREE.MathUtils.clamp(controls.target.y, BASE, 40);
  controls.update();
  const d = camera.position.distanceTo(controls.target);
  scene.fog.near = d * 0.8; scene.fog.far = d * 3.2;
  const ta = tiltStrength(); tiltPass.uniforms.uAmount.value += (ta - tiltPass.uniforms.uAmount.value) * 0.12;
  tiltPass.uniforms.uVig.value = tiltOn ? 0.16 : 0;
  composer.render();
});
document.getElementById('loading').style.opacity = 0;
setTimeout(() => document.getElementById('loading').remove(), 700);
window.__dbg = { scene, camera, controls, go, ROUTE, trains, CROSSINGS, setTime };
</script>
